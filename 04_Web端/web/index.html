<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 内联 SVG favicon（正红方块 + 白「质」），省掉一次 favicon.ico 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23B72C24'/%3E%3Ctext x='16' y='24' font-family='Arial,Helvetica,sans-serif' font-size='21' font-weight='700' fill='%23F7F5F0' text-anchor='middle'%3E%E8%B4%A8%3C/text%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#F7F5F0" />
    <!-- 字体：标题衬线（Noto Serif SC）+ 正文无衬线（Noto Sans SC）。用 Google 中国镜像，
         国内可直连；若被网络拦截，自动回退到系统中文（Songti SC / 微软雅黑 等）。 -->
    <link rel="preconnect" href="https://fonts.googleapis.cn" crossorigin />
    <link
      href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- 双保险：即使服务端 no-cache 头被中间层剥掉，也不让浏览器复用旧 index.html -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>质检部周工作平台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
